name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o dist/jetkvm-status-agent ./cmd/jetkvm-status-agent
      - run: python3 scripts/smoke.py dist/jetkvm-status-agent
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o dist/jetkvm-status-agent-linux-arm ./cmd/jetkvm-status-agent
